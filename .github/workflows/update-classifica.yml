name: Update Treviso United data

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run scraper
        run: python scripts/scrape_classifica.py

      - name: Commit updated data if changed
        run: |
          git config user.name "united-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/data/treviso-united.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Treviso United data [skip ci]"
            git push
          fi
